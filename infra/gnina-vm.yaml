# Lima VM: arm64 Ubuntu on Apple Virtualization.framework with Rosetta for x86-64 binaries (GNINA has no arm64 build).
vmType: vz
cpus: 6
memory: 8GiB
disk: 30GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
mounts:
  - location: "~/proteinscreen"
    writable: true
